<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phát luồng HLS với hls.js</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    video {
      width: 100%;
      max-width: 900px;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay muted playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const videoSrc = 'https://tv360-sports.vercel.app/GbsUFR1zzzv8Er/video1/11/index.m3u8';

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, function (event, data) {
        console.error('Lỗi hls.js:', data);
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Dành cho Safari / iOS hỗ trợ HLS gốc
      video.src = videoSrc;
      video.addEventListener('loadedmetadata', function () {
        video.play().catch(() => {});
      });
    } else {
      alert('Trình duyệt của bạn không hỗ trợ phát HLS.');
    }
  </script>
</body>
</html>
